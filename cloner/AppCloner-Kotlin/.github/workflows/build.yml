name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'APK/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: appcloner-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project folder
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build.gradle.kts ]]; then
            PROJECT_DIR='.'
          elif [[ -f cloner/app/build.gradle.kts ]]; then
            PROJECT_DIR='cloner'
          else
            PROJECT_FILE="$(find . -type f -path '*/app/build.gradle.kts' -not -path '*/.gradle/*' | head -n 1)"
            if [[ -z "$PROJECT_FILE" ]]; then
              echo 'ERROR: Could not find app/build.gradle.kts. Upload the project files, not the ZIP itself.'
              exit 1
            fi
            PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project folder: $PROJECT_DIR"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/shaheen/appcloner/MainActivity.kt"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # Retry once for transient dependency-download or runner network failures.
          for attempt in 1 2; do
            if gradle --no-daemon --stacktrace assembleDebug; then
              break
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo 'Gradle build failed twice. Review the compiler error above.'
              exit 1
            fi
            echo 'Build attempt failed; retrying once...'
            sleep 5
          done
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK in repository APK folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p APK
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" APK/AppCloner-debug.apk
          ls -lh APK/AppCloner-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppCloner-APK
          path: APK/AppCloner-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to the current branch
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f APK/AppCloner-debug.apk
          if git diff --cached --quiet; then
            echo 'APK is unchanged; no commit is needed.'
          else
            git commit -m 'Build App Cloner APK [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
